[pytest]
minversion = 6.0
testpaths = tenrec/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=tenrec
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests using mocks (require IDADIR but no fixture binaries).
    integration: Integration tests against a real IDA Database.
    fixture: Integration tests requiring a built fixture database under tenrec/tests/fixtures/databases/.
    slow: Tests that take noticeably longer than the rest of the suite.
