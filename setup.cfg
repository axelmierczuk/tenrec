; Mutation testing — `uv run mutmut run` mutates plugin code and re-runs
; the unit suite. Any mutant that survives is a weak (or missing)
; assertion. Integration tests are skipped here because each example
; takes ~1s of IDA work, which would multiply across hundreds of mutants
; and dwarf the cost of the actual mutation logic. Mutation testing
; exercises plugin transformation code, which is exactly what the unit
; tests cover.
[mutmut]
; Source paths whose mutations the unit suite should kill. database_manager
; is included because tenrec/tests/unit/test_database_manager.py exercises
; it; sessions.py and server.py are deliberately excluded — they have no
; unit-level coverage today, so every mutant would survive vacuously.
paths_to_mutate=tenrec/plugins/plugins/,tenrec/plugins/models/,tenrec/plugins/database_manager.py
tests_dir=tenrec/tests/unit
runner=uv run pytest tenrec/tests/unit -m unit -x --no-cov -q
